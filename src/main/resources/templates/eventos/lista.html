<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Programación de Eventos y Proyectos')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">

    <!-- Cabecera -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1">Programación de Eventos y Proyectos</h1>
            <p class="text-muted small mb-0">Control de producción, calendarios y presupuestos de EVENTIA</p>
        </div>
        <div>
            <a th:href="@{/eventos/nuevo}" class="btn btn-primary shadow-sm">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Evento
            </a>
        </div>
    </div>

    <!-- Mensajes Flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Panel de Filtros -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/eventos}" method="get" class="row g-3 align-items-end">
                <!-- Filtro por Estado -->
                <div class="col-12 col-md-4">
                    <label for="estadoSelect" class="form-label small fw-bold text-uppercase text-secondary mb-1">
                        Filtrar por Estado
                    </label>
                    <select id="estadoSelect" name="estado" class="form-select" onchange="this.form.submit()">
                        <option value="">-- Todos los Estados --</option>
                        <option value="PRESUPUESTADO" th:selected="${estadoFiltro == 'PRESUPUESTADO'}">Presupuestado</option>
                        <option value="CONFIRMADO" th:selected="${estadoFiltro == 'CONFIRMADO'}">Confirmado</option>
                        <option value="EN_PROCESO" th:selected="${estadoFiltro == 'EN_PROCESO'}">En Proceso</option>
                        <option value="FINALIZADO" th:selected="${estadoFiltro == 'FINALIZADO'}">Finalizado</option>
                    </select>
                </div>

                <!-- Filtro por Cliente -->
                <div class="col-12 col-md-5">
                    <label for="clienteSelect" class="form-label small fw-bold text-uppercase text-secondary mb-1">
                        Filtrar por Cliente
                    </label>
                    <select id="clienteSelect" name="clienteId" class="form-select" onchange="this.form.submit()">
                        <option value="">-- Todos los Clientes --</option>
                        <option th:each="cli : ${clientes}"
                                th:value="${cli.id}"
                                th:text="${cli.razonSocial}"
                                th:selected="${clienteIdFiltro != null and clienteIdFiltro == cli.id}">
                        </option>
                    </select>
                </div>

                <!-- Botones -->
                <div class="col-12 col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-dark flex-grow-1">
                        <i class="bi bi-funnel me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/eventos}" class="btn btn-outline-secondary" title="Limpiar Filtros">
                        Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Eventos -->
    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light text-uppercase small text-secondary">
                <tr>
                    <th class="ps-4 py-3">Evento / Proyecto</th>
                    <th class="py-3">Cliente Contratante</th>
                    <th class="py-3">Fechas</th>
                    <th class="py-3">Presupuesto</th>
                    <th class="py-3">Estado</th>
                    <th class="pe-4 py-3 text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evento : ${eventos}">
                    <!-- Evento y Ubicación -->
                    <td class="ps-4 py-3">
                        <div class="fw-bold text-dark" th:text="${evento.nombreEvento}"></div>
                        <div th:if="${evento.ubicacion != null and !evento.ubicacion.isEmpty()}"
                             class="text-muted small">
                            <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                            <span th:text="${evento.ubicacion}"></span>
                        </div>
                    </td>

                    <!-- Cliente Contratante -->
                    <td class="py-3">
                        <div class="fw-medium text-dark" th:text="${evento.cliente?.razonSocial}"></div>
                        <div class="text-muted small font-monospace" th:text="${evento.cliente?.cif}"></div>
                    </td>

                    <!-- Fechas -->
                    <td class="py-3">
                        <div class="small fw-medium text-dark">
                            <i class="bi bi-calendar3 text-primary me-1"></i>
                            <span th:text="${evento.fechaInicio != null ? #temporals.format(evento.fechaInicio, 'dd/MM/yyyy') : '—'}"></span>
                        </div>
                        <div class="small text-muted">
                            hasta <span th:text="${evento.fechaFin != null ? #temporals.format(evento.fechaFin, 'dd/MM/yyyy') : '—'}"></span>
                        </div>
                    </td>

                    <!-- Presupuesto -->
                    <td class="py-3 fw-semibold text-dark">
                        <span th:if="${evento.presupuesto != null}"
                              th:text="${#numbers.formatDecimal(evento.presupuesto, 1, 'POINT', 2, 'COMMA') + ' €'}"></span>
                        <span th:if="${evento.presupuesto == null}" class="text-muted">—</span>
                    </td>

                    <!-- Badge de Estado -->
                    <td class="py-3">
                        <span class="badge rounded-pill px-3 py-2"
                              th:classappend="${evento.estado == 'PRESUPUESTADO' ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' :
                                               (evento.estado == 'CONFIRMADO' ? 'bg-primary-subtle text-primary-emphasis border border-primary-subtle' :
                                               (evento.estado == 'EN_PROCESO' ? 'bg-info-subtle text-info-emphasis border border-info-subtle' :
                                               'bg-success-subtle text-success-emphasis border border-success-subtle'))}"
                              th:text="${evento.estado}">
                        </span>
                    </td>

                    <!-- Acciones -->
                    <td class="pe-4 py-3 text-end">
                        <div class="d-inline-flex gap-2">
                            <a th:href="@{/eventos/editar/{id}(id=${evento.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil-square me-1"></i> Editar
                            </a>
                            <form th:action="@{/eventos/eliminar/{id}(id=${evento.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Deseas eliminar este evento de la programación?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- Sin resultados -->
                <tr th:if="${#lists.isEmpty(eventos)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                        No se han encontrado eventos registrados o con los filtros seleccionados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
