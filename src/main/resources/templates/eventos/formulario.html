<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${esEdicion ? 'Editar Evento / Proyecto' : 'Nuevo Evento / Proyecto'})}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4" style="max-width: 900px;">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1"
                th:text="${esEdicion ? 'Editar Evento / Proyecto' : 'Nuevo Evento / Proyecto'}"></h1>
            <p class="text-muted small mb-0">Registro de datos técnicos y económicos para la gestión de EVENTIA</p>
        </div>
        <a th:href="@{/eventos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver a Eventos
        </a>
    </div>

    <!-- Alerta de Error -->
    <div th:if="${errorMsg}" class="alert alert-danger shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-octagon-fill me-2"></i>
        <span th:text="${errorMsg}"></span>
    </div>

    <!-- Formulario Bootstrap 5 -->
    <form th:action="@{/eventos/guardar}" th:object="${evento}" method="post" class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <!-- ID oculto para edición -->
            <input type="hidden" th:field="*{id}" />

            <!-- Sección 1: Definición del Proyecto -->
            <h5 class="text-primary border-bottom pb-2 mb-3">
                <i class="bi bi-bookmark-star-fill me-1"></i> 1. Definición del Proyecto
            </h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="nombreEvento" class="form-label fw-semibold">
                        Nombre del Evento <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           id="nombreEvento"
                           th:field="*{nombreEvento}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombreEvento')} ? 'is-invalid' : ''"
                           placeholder="Ej. Cabalgata de Reyes 2027"
                           required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreEvento')}" th:errors="*{nombreEvento}"></div>
                </div>

                <div class="col-md-6">
                    <label for="clienteSelect" class="form-label fw-semibold">
                        Cliente Contratante <span class="text-danger">*</span>
                    </label>
                    <select id="clienteSelect"
                            name="clienteId"
                            class="form-select"
                            required>
                        <option value="">-- Selecciona un Cliente --</option>
                        <option th:each="cli : ${clientes}"
                                th:value="${cli.id}"
                                th:text="${cli.razonSocial + ' (' + cli.cif + ')'}"
                                th:selected="${evento.cliente != null and evento.cliente.id == cli.id}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Sección 2: Programación y Presupuesto -->
            <h5 class="text-primary border-bottom pb-2 mb-3">
                <i class="bi bi-calendar-range me-1"></i> 2. Programación y Presupuesto
            </h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="fechaInicio" class="form-label fw-semibold">
                        Fecha de Inicio <span class="text-danger">*</span>
                    </label>
                    <input type="date"
                           id="fechaInicio"
                           th:field="*{fechaInicio}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid' : ''"
                           required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                </div>

                <div class="col-md-4">
                    <label for="fechaFin" class="form-label fw-semibold">
                        Fecha de Fin <span class="text-danger">*</span>
                    </label>
                    <input type="date"
                           id="fechaFin"
                           th:field="*{fechaFin}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fechaFin')} ? 'is-invalid' : ''"
                           required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
                </div>

                <div class="col-md-4">
                    <label for="presupuesto" class="form-label fw-semibold">Presupuesto (€)</label>
                    <div class="input-group">
                        <input type="number"
                               step="0.01"
                               min="0"
                               id="presupuesto"
                               th:field="*{presupuesto}"
                               class="form-control font-monospace"
                               placeholder="Ej. 15000.00" />
                        <span class="input-group-text">€</span>
                    </div>
                </div>
            </div>

            <!-- Sección 3: Estado y Recinto -->
            <h5 class="text-primary border-bottom pb-2 mb-3">
                <i class="bi bi-pin-map-fill me-1"></i> 3. Estado y Recinto
            </h5>
            <div class="row g-3">
                <div class="col-md-5">
                    <label for="estado" class="form-label fw-semibold">
                        Estado del Proyecto <span class="text-danger">*</span>
                    </label>
                    <select id="estado" th:field="*{estado}" class="form-select" required>
                        <option value="PRESUPUESTADO">Presupuestado</option>
                        <option value="CONFIRMADO">Confirmado</option>
                        <option value="EN_PROCESO">En Proceso</option>
                        <option value="FINALIZADO">Finalizado</option>
                    </select>
                </div>

                <div class="col-md-7">
                    <label for="ubicacion" class="form-label fw-semibold">Ubicación / Recinto</label>
                    <input type="text"
                           id="ubicacion"
                           th:field="*{ubicacion}"
                           class="form-control"
                           placeholder="Ej. Plaza del Ayuntamiento, Albolote" />
                </div>
            </div>

        </div>

        <!-- Pie del Formulario -->
        <div class="card-footer bg-light py-3 px-4 d-flex justify-content-end gap-2">
            <a th:href="@{/eventos}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-1"></i>
                <span th:text="${esEdicion ? 'Actualizar Evento' : 'Guardar Evento'}"></span>
            </button>
        </div>
    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
