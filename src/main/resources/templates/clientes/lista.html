<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cartera de Clientes')}">
    <title>EVENTIA | Listado clientes</title>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">

    <!-- Cabecera de la sección -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1">Cartera de Clientes</h1>
            <p class="text-muted small mb-0">Gestión integral de clientes y entidades contratantes para EVENTIA</p>
        </div>
        <div>
            <a th:href="@{/clientes/nuevo}" class="btn btn-primary shadow-sm">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Cliente
            </a>
        </div>
    </div>

    <!-- Mensajes Flash de Éxito / Error -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Barra de Búsqueda -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/clientes}" method="get" class="row g-2 align-items-center">
                <div class="col-12 col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text"
                               name="buscar"
                               title="Buscar"
                               th:value="${buscar}"
                               class="form-control"
                               placeholder="Buscar por Razón Social (ej. Ayuntamiento, Empresa...)">
                    </div>
                </div>
                <div class="col-12 col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100">
                        Buscar
                    </button>
                    <a th:if="${buscar != null and !buscar.isEmpty()}"
                       th:href="@{/clientes}"
                       class="btn btn-outline-secondary"
                       title="Limpiar búsqueda">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light text-uppercase small text-secondary">
                <tr>
                    <th class="ps-4 py-3">Razón Social</th>
                    <th class="py-3">CIF / NIF</th>
                    <th class="py-3">Contacto</th>
                    <th class="py-3">Ubicación Validada</th>
                    <th class="pe-4 py-3 text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <!-- Razón Social -->
                    <td class="ps-4 py-3">
                        <div class="fw-semibold text-dark" th:text="${cliente.razonSocial}"></div>
                        <div th:if="${cliente.direccionCalle != null and !cliente.direccionCalle.isEmpty()}"
                             class="text-muted small">
                            <i class="bi bi-signpost me-1"></i>
                            <span th:text="${cliente.direccionCalle}"></span>
                        </div>
                    </td>

                    <!-- CIF / NIF -->
                    <td class="py-3">
                        <span class="badge bg-light text-dark border font-monospace px-2 py-1"
                              th:text="${cliente.cif}"></span>
                    </td>

                    <!-- Contacto -->
                    <td class="py-3">
                        <div class="fw-medium text-dark"
                             th:text="${cliente.personaContacto != null and !cliente.personaContacto.isEmpty() ? cliente.personaContacto : '—'}"></div>
                        <div th:if="${cliente.email != null and !cliente.email.isEmpty()}" class="text-muted small">
                            <i class="bi bi-envelope me-1"></i>
                            <span th:text="${cliente.email}"></span>
                        </div>
                        <div th:if="${cliente.telefono != null and !cliente.telefono.isEmpty()}" class="text-muted small">
                            <i class="bi bi-telephone me-1"></i>
                            <span th:text="${cliente.telefono}"></span>
                        </div>
                    </td>

                    <!-- Municipio y Provincia -->
                    <td class="py-3">
                        <div th:if="${cliente.municipio != null}">
                            <div class="fw-medium text-dark" th:text="${cliente.municipio?.nombre}"></div>
                            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle">
                                <span th:text="${cliente.municipio?.provincia?.nombre}"></span>
                                (CP: <span th:text="${cliente.municipio?.codigoPostal}"></span>)
                            </span>
                        </div>
                        <span th:if="${cliente.municipio == null}" class="text-muted fst-italic small">
                            Sin ubicación asignada
                        </span>
                    </td>

                    <!-- Acciones -->
                    <td class="pe-4 py-3 text-end">
                        <div class="d-inline-flex gap-2">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil-square me-1"></i> Editar
                            </a>
                            <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Estás seguro de que deseas eliminar este cliente?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- Estado vacío -->
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        No se encontraron clientes registrados en la base de datos.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
