<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmento HEAD con Bootstrap 5.3 y Bootstrap Icons -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | EVENTIA ERP & CRM'">EVENTIA ERP & CRM</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        .navbar-brand-badge {
            background-color: #4f46e5;
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
        }
        .table > :not(caption) > * > * {
            vertical-align: middle;
        }
    </style>
</head>

<body>

<!-- Fragmento Barra de Navegación Principal -->
<header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/clientes}">
                <span class="navbar-brand-badge">EVENTIA</span>
                <span class="text-secondary small fw-semibold text-uppercase d-none d-sm-inline" style="letter-spacing: 0.1em;">
                    ERP &amp; CRM
                </span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEventia"
                    aria-controls="navbarEventia" aria-expanded="false" aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarEventia">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded"
                           th:classappend="${seccionActiva == 'clientes'} ? 'active bg-secondary bg-opacity-25 fw-semibold text-white' : ''"
                           th:href="@{/clientes}">
                            <i class="bi bi-building me-1"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded"
                           th:classappend="${seccionActiva == 'eventos'} ? 'active bg-secondary bg-opacity-25 fw-semibold text-white' : ''"
                           th:href="@{/eventos}">
                            <i class="bi bi-calendar-event me-1"></i> Eventos y Proyectos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- Fragmento Pie de Página -->
<footer th:fragment="footer" class="bg-white border-top py-3 mt-5 text-center text-muted small">
    <div class="container">
        EVENTIA OCIO Y EVENTOS, S.L. &copy; 2026 &mdash; Sistema de Gestión Integrado ERP/CRM (Edición Thymeleaf + Bootstrap 5)
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</footer>

</body>
</html>
