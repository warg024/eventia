# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=eventia
server.port=8080

# ===================================================================
# CONEXIÓN A LA BASE DE DATOS (MariaDB / MySQL)
# ===================================================================
# URL de conexión: servidor local, puerto 3306 y la base de datos 'eventia'
spring.datasource.url=jdbc:mariadb://localhost:3306/eventia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario y contraseña de MariaDB en tu equipo local
spring.datasource.username=angel
spring.datasource.password=AA11zz..

# Driver JDBC de MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Dialecto de base de datos para MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ddl-auto=update actualiza la estructura de tablas sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de IntelliJ las consultas SQL ejecutadas y las formatea
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantiene abierta la sesión JPA durante la serialización JSON de respuestas web
spring.jpa.open-in-view=true

# Garantiza que data.sql se ejecute siempre en MariaDB justo después de que Hibernate cree/actualice las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true
